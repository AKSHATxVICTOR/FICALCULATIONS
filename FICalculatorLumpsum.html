<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FI Calculator – Lump Sum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="fi-theme.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header>
  <a href="page1.html" class="nav-back">← Back</a>
  <h1>FI<span class="dot">.</span>Calculator</h1>
  <p>Financial Independence & Retirement Age Calculator</p>
  <span class="page-tag">Lump Sum Investment</span>
</header>

<main>
  <section class="card">
    <h2>Enter Your Details</h2>

    <label>Current Age <span style="color:var(--accent)">*</span></label>
    <input type="number" id="currentAge" placeholder="e.g. 35">

    <label>Lump Sum Investment Amount (₹) <span style="color:var(--accent)">*</span></label>
    <input type="number" id="lumpsumAmount" placeholder="e.g. 1000000">

    <label>Expected Annual Return (%) <span style="color:var(--accent)">*</span></label>
    <input type="number" id="returnRate" placeholder="e.g. 12">

    <label>Target Retirement Corpus (₹) <span style="color:var(--accent)">*</span></label>
    <input type="number" id="targetCorpus" placeholder="e.g. 50000000">

    <button onclick="window.calculateLumpsumFI()">Calculate FI Age →</button>
  </section>

  <section class="card result">
    <h2>Result</h2>
    <p id="output">Enter details and click calculate</p>
    <h3>Investment Breakdown</h3>
    <canvas id="donutChart"></canvas>
  </section>
</main>

<footer>
  <p>FI Calculator © 2026 &nbsp;·&nbsp; Informational Tool – Not Financial Advice</p>
</footer>

<script src="lumpsum.js"></script>
</body>
</html>
